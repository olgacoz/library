<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Library</title>
  <link rel="stylesheet" href="styles.css">
  <script src="library-logic.js" defer></script>
</head>

<body>
  <h1>Library</h1>
  <main>
    <button command="show-modal" commandfor="new-book-dialog">New Book</button>
    <dialog id="new-book-dialog">
      <form>
        <div>
          <label for="book_title">Title *:</label>
          <input type="text" name="book_title" id="book_title" required>
        </div>
        <div>
          <label for="author">Author *:</label>
          <input type="text" name="author" id="author" required>
        </div>
        <div>
          <label for="pages">Pages *:</label>
          <input type="number" name="pages" id="pages" min="1" required>
        </div>
        <div>
          <label for="read">Read:</label>
          <input type="checkbox" name="read" id="read">
        </div>
        <div>
          <button value="cancel" formmethod="dialog" formnovalidate>Cancel</button>
          <button id="new-book-confirm-btn" value="default">Confirm</button>
        </div>
      </form>
    </dialog>
    <div class="library">
    </div>
  </main>
</body>

</html>
